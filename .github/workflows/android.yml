name: Android offline build
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          sdkmanager_path=$(python3 -c 'import os,pathlib; print(next(pathlib.Path(os.environ["ANDROID_HOME"]).glob("cmdline-tools/*/bin/sdkmanager")))')
          "$sdkmanager_path" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare persistent LAB debug signing key
        shell: bash
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/vmr-lab-debug.jks"
          base64 --decode ci/vmr-lab-debug.jks.b64 > "$key"
          test -s "$key"
          echo "VMR_LAB_KEYSTORE=$key" >> "$GITHUB_ENV"
          echo "VMR_LAB_STORE_PASSWORD=vmr-lab-test-2026" >> "$GITHUB_ENV"
          echo "VMR_LAB_KEY_ALIAS=vmrlab" >> "$GITHUB_ENV"
          echo "VMR_LAB_KEY_PASSWORD=vmr-lab-test-2026" >> "$GITHUB_ENV"
          cert="$(keytool -list -v -keystore "$key" -storepass vmr-lab-test-2026 -alias vmrlab | awk -F'SHA256: ' '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')"
          test "$cert" = "2004c354038a441292e861ff1513391d26d3dfc011289dea16dee1d72f145182"
          echo "VMR_LAB_CERT_SHA256=$cert" >> "$GITHUB_ENV"
          echo "Persistent LAB certificate verified: $cert"

      - name: Prepare Sherpa-ONNX and Piper Jessica
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets/tts/piper/jessica
          curl --fail --location --retry 3 \
            -o app/libs/sherpa-onnx-1.13.4.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar"
          echo "03f9c4df965f21c71269365a7951a7f23b5696fddd093fa318c80d65550ab780  app/libs/sherpa-onnx-1.13.4.aar" | sha256sum -c -
          # Sherpa 1.13.4 uses ONNX Runtime 1.27.0. VisionMaxRead supplies that
          # Maven-published ORT once for Paddle/NER + Sherpa, so remove only the
          # duplicate native copy inside the authenticated Sherpa AAR.
          zip -q -d app/libs/sherpa-onnx-1.13.4.aar 'jni/*/libonnxruntime.so'
          work="$(mktemp -d)"
          archive="$work/upmc-medium.tar.bz2"
          curl --fail --location --retry 3 \
            -o "$archive" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-upmc-medium.tar.bz2"
          echo "e9830a331a16f6cc5ef3116a287065e015d3495c3f56b974889a266da7f89a7f  $archive" | sha256sum -c -
          tar -xjf "$archive" -C "$work"
          cp -a "$work/vits-piper-fr_FR-upmc-medium/." app/src/main/assets/tts/piper/jessica/
          test -s app/src/main/assets/tts/piper/jessica/fr_FR-upmc-medium.onnx
          test -s app/src/main/assets/tts/piper/jessica/tokens.txt
          test -d app/src/main/assets/tts/piper/jessica/espeak-ng-data
          # Optional high-articulation French Siwis: pin exact official release
          # asset digest (GitHub release asset 324609218), never download in app.
          archive_siwis="$work/siwis-medium.tar.bz2"
          curl --fail --location --retry 3 --retry-all-errors \
            -o "$archive_siwis" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-siwis-medium.tar.bz2"
          echo "375909aa30842b3a4efa10b1beb1d761af792960ae6873b4d53889f96c66195b  $archive_siwis" | sha256sum -c -
          tar -xjf "$archive_siwis" -C "$work"
          mkdir -p app/src/main/assets/tts/piper/siwis
          cp -a "$work/vits-piper-fr_FR-siwis-medium/." app/src/main/assets/tts/piper/siwis/
          test -s app/src/main/assets/tts/piper/siwis/fr_FR-siwis-medium.onnx
          test -s app/src/main/assets/tts/piper/siwis/tokens.txt
          test -d app/src/main/assets/tts/piper/siwis/espeak-ng-data

      - name: VMR-010 source and semantic benchmark contract
        run: |
          python3 scripts/test_vmr010_contract.py
          python3 scripts/mobilemoe_benchmark.py --cases tests/vmr010-synthetic.jsonl --output /tmp/vmr010-synthetic-metrics.json
      - name: Prepare pinned offline models
        run: python3 scripts/prepare_models.py
      - name: Prepare Indra Latin test models (build-time only)
        run: python3 scripts/prepare_indra_models.py
      - name: Verify Indra models
        run: python3 scripts/prepare_indra_models.py --verify
      - name: Tests, lint, APK and AAB
        run: ./gradlew :core:check :app:lintDebug :app:assembleDebug :app:bundleRelease --no-daemon
      - name: Lossless archive contract
        run: bash scripts/test-archive.sh
      - name: Verify installable APK
        run: python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify LAB package version and persistent certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          badging="$("$build_tools/aapt" dump badging "$apk" | head -n1)"
          echo "$badging"
          echo "$badging" | grep -F "name='fr.visionmaxread.labdebug'"
          echo "$badging" | grep -F "versionCode='11'"
          cert="$("$build_tools/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')"
          echo "APK_CERT_SHA256=$cert"
          test "$cert" = "$VMR_LAB_CERT_SHA256"
      - name: Name artifacts and record sizes
        run: |
          mkdir artifacts
          apk="artifacts/VisionMaxRead-0.5.0-INDRA-ORDER-SIWIS-LAB.apk"
          aab="artifacts/VisionMaxRead-0.5.0-INDRA-ORDER-SIWIS-LAB-unsigned.aab"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          cp app/build/reports/lint-results-debug.html artifacts/
          {
            echo "RUN_ID=${{ github.run_id }}"
            echo "HEAD_SHA=${{ github.sha }}"
            echo "APK_NAME=$(basename "$apk")"
            echo "APK_BYTES=$(stat -c%s "$apk")"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_PACKAGE=fr.visionmaxread.labdebug"
            echo "APK_VERSION_CODE=11"
            echo "APK_CERT_SHA256=$VMR_LAB_CERT_SHA256"
            echo "AAB_NAME=$(basename "$aab")"
            echo "AAB_BYTES=$(stat -c%s "$aab")"
            echo "AAB_SHA256=$(sha256sum "$aab" | awk '{print $1}')"
          } | tee artifacts/build-manifest.txt
      - name: Upload compact build metadata
        uses: actions/upload-artifact@v4
        with:
          name: VisionMaxRead-0.5.0-INDRA-ORDER-SIWIS-LAB-metadata
          path: artifacts/build-manifest.txt
          retention-days: 14
      # GitHub Actions upload-artifact v7 supports *direct* single-file
      # browser downloads since 2026-02-26. Do not re-zip this massive APK.
      # Source, signature, sha and package were verified before this upload.
      - name: Upload signed LAB APK directly (no ZIP)
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/VisionMaxRead-0.5.0-INDRA-ORDER-SIWIS-LAB.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
      # The unsigned AAB is a separate technical artifact, never an installable APK.
      - name: Upload unsigned AAB separately
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/VisionMaxRead-0.5.0-INDRA-ORDER-SIWIS-LAB-unsigned.aab
          archive: false
          if-no-files-found: error
          retention-days: 14
