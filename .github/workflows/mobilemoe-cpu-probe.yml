name: Experimental Meta MobileMoE French OCR (PC only)
on:
  workflow_dispatch:
  push:
    branches: ['feature/vmr013-moe-copy-passes']
    paths:
      - '.github/workflows/mobilemoe-cpu-probe.yml'
permissions:
  contents: read
jobs:
  model-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CPU scientific runtime
        run: |
          python -m pip install --no-cache-dir torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==4.57.6 huggingface-hub==0.36.0 safetensors==0.7.0 accelerate==1.13.0
      - name: Run actual Meta MobileMoE on synthetic French OCR
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
        run: |
          python scripts/mobilemoe_cpu_probe.py --output /tmp/mobilemoe-cpu-research.json --limit 2
      - name: Expose safe synthetic research results (no user documents)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VMR013-meta-mobilemoe-research
          path: /tmp/mobilemoe-cpu-research.json
          if-no-files-found: ignore
          retention-days: 14
