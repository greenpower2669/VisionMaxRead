plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'fr.visionmaxread'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'fr.visionmaxread'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.4.2-debug'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        if (System.getenv('VMR_LAB_KEYSTORE')) {
            lab {
                storeFile file(System.getenv('VMR_LAB_KEYSTORE'))
                storePassword System.getenv('VMR_LAB_STORE_PASSWORD')
                keyAlias System.getenv('VMR_LAB_KEY_ALIAS')
                keyPassword System.getenv('VMR_LAB_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.labdebug'
            if (signingConfigs.findByName('lab') != null) signingConfig signingConfigs.lab
        }
        release { minifyEnabled false }
    }
    // Every model is loaded through AssetManager streams; stored ZIP entries are unnecessary.
    // Lossless compression preserves exact bytes; legacy packaging extracts the same native libs.
    androidResources { noCompress += ['xz', 'litertlm'] }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation project(':core')
    implementation project(':ppocr-sdk')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    // Qwen3.5 VL runs fully on-device through LiteRT-LM; Piper runs through Sherpa-ONNX.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
    implementation files('libs/sherpa-onnx-1.13.4.aar')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
tasks.register('verifyModels', Exec) { workingDir rootProject.projectDir; commandLine 'python3', 'scripts/prepare_models.py', '--verify' }
tasks.named('preBuild') { dependsOn 'verifyModels' }
