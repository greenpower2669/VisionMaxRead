plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'fr.visionmaxread'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'fr.visionmaxread'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false } }
    androidResources { noCompress += ['onnx'] }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation project(':core')
    implementation project(':ppocr-sdk')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
tasks.register('verifyModels', Exec) { workingDir rootProject.projectDir; commandLine 'python3', 'scripts/prepare_models.py', '--verify' }
tasks.named('preBuild') { dependsOn 'verifyModels' }
