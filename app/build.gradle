plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'fr.visionmaxread'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'fr.visionmaxread'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0-lab'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { applicationIdSuffix '.lab' }
        release { minifyEnabled false }
    }
    // Every model is loaded through AssetManager streams; stored ZIP entries are unnecessary.
    // Lossless compression preserves exact bytes; legacy packaging extracts the same native libs.
    androidResources { noCompress += ['xz'] }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation project(':core')
    implementation project(':ppocr-sdk')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'org.tukaani:xz:1.10'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    // Bundled ML Kit model works without Play Services model download.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
tasks.register('verifyModels', Exec) { workingDir rootProject.projectDir; commandLine 'python3', 'scripts/prepare_models.py', '--verify' }
tasks.named('preBuild') { dependsOn 'verifyModels' }
